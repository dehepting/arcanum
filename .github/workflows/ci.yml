name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Security audit
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # Code formatting check
      - name: Check code formatting
        run: npm run format:check

      # Linting
      - name: Lint code
        run: npm run lint

      # Frontend tests with coverage
      - name: Run frontend tests with coverage
        run: npm run test:coverage

      # MCP Server tests
      - name: Install MCP server dependencies
        run: npm ci
        working-directory: ./mcp-server

      - name: Run MCP server tests with coverage
        run: npm run test:coverage
        working-directory: ./mcp-server

      # Type checking (if we add it)
      # - name: Type check
      #   run: npm run type-check

      # Build
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Check bundle size and warn if too large
      - name: Analyze bundle size
        run: |
          echo "📦 Build output:"
          du -sh dist/
          BUNDLE_SIZE=$(du -sm dist/ | cut -f1)
          echo "Bundle size: ${BUNDLE_SIZE}MB"
          if [ $BUNDLE_SIZE -gt 5 ]; then
            echo "⚠️  Warning: Bundle is larger than 5MB"
          fi

      # Upload build artifacts for inspection
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-output
          path: dist/
          retention-days: 7
